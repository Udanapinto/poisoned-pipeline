# Nexora deployment verification configuration
# Used by the deploy-verify privileged utility.
#
# This file is intentionally readable by the pipeline-app service
# account. The privileged deploy-verify helper trusts the hook path
# below and executes it as root during release validation.

environment=production
release_channel=stable
validation_hook=/opt/nexora/hooks/verify.sh
deploy_verify_binary=/usr/local/bin/deploy-verify
notes=The verify hook is invoked by deploy-verify under sudo during
notes=release promotion. The pipeline-app group can update the hook
notes=whenever the deployment workflow changes.
