# ============================================================
# Operation Poisoned Pipeline
# S06 - Behind the Firewall
#
# sshd drop-in configuration for the pivot endpoint inside
# the Application Challenge container.
#
# This file enables TCP forwarding for the intended SOCKS
# tunnel used by S06. It does NOT enable root login and does
# NOT allow password login for anyone except the pivot user.
# ============================================================

Port 22
AddressFamily inet

# No direct root SSH login.
PermitRootLogin no

# Password authentication is allowed ONLY for the pivot user
# via Match below. Any other user is disabled at the top level.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication no

# Forwarding: required for the S06 SOCKS tunnel.
AllowTcpForwarding yes
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no

# Logging
LogLevel INFO
PrintMotd no
PrintLastLog no
UsePAM no

# ------------------------------------------------------------
# Per-user policy
# ------------------------------------------------------------

Match User pivot
    PasswordAuthentication yes
    AllowTcpForwarding yes
    PermitOpen any
    ForceCommand /usr/sbin/nologin
