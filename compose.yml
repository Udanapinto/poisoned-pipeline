name: poisoned-pipeline


# ==========================================================
# SERVICES
# ==========================================================

services:

  # ========================================================
  # MariaDB
  #
  # Persistent database used by CTFd.
  #
  # IMPORTANT:
  # - control_net only
  # - NO host published port
  # ========================================================

  mariadb:

    image: mariadb:11.4.13

    container_name: pp-mariadb

    restart: unless-stopped

    environment:

      MARIADB_DATABASE: ${CTFD_DB_NAME}

      MARIADB_USER: ${CTFD_DB_USER}

      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}

      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}


    command:

      - --character-set-server=utf8mb4

      - --collation-server=utf8mb4_unicode_ci


    volumes:

      - mariadb_data:/var/lib/mysql


    networks:

      - control_net


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 20s



  # ========================================================
  # Redis
  #
  # Cache/session support for CTFd.
  #
  # IMPORTANT:
  # - control_net only
  # - NO host published port
  # ========================================================

  redis:

    image: redis:7.4.0-alpine

    container_name: pp-redis

    restart: unless-stopped


    command:

      - redis-server

      - --appendonly

      - "yes"

      - --save

      - "60"

      - "1"


    volumes:

      - redis_data:/data


    networks:

      - control_net


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 10



  # ========================================================
  # CTFd
  #
  # CTF control platform.
  #
  # IMPORTANT:
  # - control_net only
  # - TCP 8000 is NOT published to Ubuntu
  # - participants reach it through Nginx
  # ========================================================

  ctfd:

    image: ctfd/ctfd:3.8.7

    container_name: pp-ctfd

    restart: unless-stopped


    depends_on:

      mariadb:

        condition: service_healthy

      redis:

        condition: service_healthy


    environment:

      SECRET_KEY: ${CTFD_SECRET_KEY}

      UPLOAD_FOLDER: /var/uploads

      LOG_FOLDER: /var/log/CTFd

      DATABASE_URL: >-
        mysql+pymysql://${CTFD_DB_USER}:${CTFD_DB_PASSWORD}@mariadb/${CTFD_DB_NAME}

      REDIS_URL: redis://redis:6379

      WORKERS: "2"


    volumes:

      - ctfd_uploads:/var/uploads

      - ctfd_logs:/var/log/CTFd


    expose:

      - "8000"


    networks:

      - control_net


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\" >/dev/null 2>&1"
        ]

      interval: 10s

      timeout: 5s

      retries: 12

      start_period: 30s

  # ========================================================
  # Gitea
  #
  # S01 - The Git Leak
  #
  # IMPORTANT:
  # - control_net only
  # - no host-published TCP 3000
  # - participant access only through Nginx
  # - SQLite is sufficient for the controlled CTF service
  # ========================================================

  gitea:

    image: ${GITEA_IMAGE}

    container_name: pp-gitea

    restart: unless-stopped


    environment:

      GITEA__database__DB_TYPE: sqlite3

      GITEA__database__PATH: /data/gitea/gitea.db


      GITEA__server__HTTP_PORT: "3000"

      GITEA__server__DOMAIN: 10.13.10.20

      GITEA__server__ROOT_URL: https://10.13.10.20/git/

      GITEA__server__DISABLE_SSH: "true"

      GITEA__server__OFFLINE_MODE: "true"


      GITEA__service__DISABLE_REGISTRATION: "true"


      GITEA__security__INSTALL_LOCK: "true"


    volumes:

      - gitea_data:/data


    expose:

      - "3000"


    networks:

      - control_net

  # ========================================================
  # Nginx
  #
  # Participant-facing gateway.
  #
  # Networks:
  #
  # player_net:
  #     10.13.10.20
  #
  # control_net:
  #     reverse proxy access to CTFd
  #
  # ONLY TCP 443 is published.
  # ========================================================

  nginx:

    image: nginx:1.28.0-alpine

    container_name: pp-nginx

    restart: unless-stopped


    depends_on:

      ctfd:

        condition: service_healthy
      
      gitea:

        condition: service_started

    ports:

      - "443:443"


    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      - ./nginx/certs:/etc/nginx/certs:ro


    networks:

      player_net:

        ipv4_address: 10.13.10.20

      control_net:



# ==========================================================
# PERSISTENT VOLUMES
# ==========================================================

volumes:

  mariadb_data:

  redis_data:

  ctfd_uploads:

  ctfd_logs:

  gitea_data:



# ==========================================================
# NETWORKS
# ==========================================================

networks:

  # ========================================================
  # Participant-facing network
  # ========================================================

  player_net:

    name: poisoned-pipeline_player_net

    driver: bridge

    ipam:

      driver: default

      config:

        - subnet: 10.13.10.0/24

          gateway: 10.13.10.1



  # ========================================================
  # CTF control network
  #
  # CTFd
  # MariaDB
  # Redis
  # Nginx backend
  #
  # Later:
  # Gitea
  # Jenkins
  # ========================================================

  control_net:

    name: poisoned-pipeline_control_net

    driver: bridge

    internal: true



  # ========================================================
  # Protected challenge network
  #
  # Not used by Phase 5 services yet.
  #
  # Future:
  # Application = 10.13.20.1
  # PostgreSQL  = 10.13.20.10
  # ========================================================

  internal_net:

    name: poisoned-pipeline_internal_net

    driver: bridge

    internal: true

    ipam:

      driver: default

      config:

        - subnet: 10.13.20.0/24

          gateway: 10.13.20.254