# ==========================================================
# Operation Poisoned Pipeline
# Nginx Reverse Proxy
#
# Phase 5:
#     Browser -> HTTPS Nginx -> CTFd
#
# Later:
#     Gitea and Jenkins routes will also be added here.
# ==========================================================


worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;


events {

    worker_connections 1024;

}


http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # ------------------------------------------------------
    # Logging
    # ------------------------------------------------------

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;


    # ------------------------------------------------------
    # General settings
    # ------------------------------------------------------

    sendfile on;

    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 64m;


    # ------------------------------------------------------
    # WebSocket connection handling
    # ------------------------------------------------------

    map $http_upgrade $connection_upgrade {

        default upgrade;

        '' close;

    }


    # ------------------------------------------------------
    # CTFd backend
    #
    # Docker DNS resolves "ctfd" on control_net.
    # ------------------------------------------------------

    upstream ctfd_backend {

        server ctfd:8000;

        keepalive 16;

    }

    # ------------------------------------------------------
    # Jenkins backend
    # S02 - Pipeline Breach
    # ------------------------------------------------------

    upstream jenkins_backend {
        server jenkins:8080;
        keepalive 8;
    }

    # ------------------------------------------------------
    # Gitea backend
    # S01 - The Git Leak
    # ------------------------------------------------------

    upstream gitea_backend {

        server gitea:3000;

        keepalive 8;

    }

    # ------------------------------------------------------
    # Participant-facing HTTPS server
    # ------------------------------------------------------

    server {

        listen 443 ssl;

        server_name localhost ctf.local 10.13.10.20;


        # --------------------------------------------------
        # TLS
        # --------------------------------------------------

        ssl_certificate
            /etc/nginx/certs/ctf.crt;

        ssl_certificate_key
            /etc/nginx/certs/ctf.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:10m;

        ssl_session_timeout 10m;

        # --------------------------------------------------
        # Gitea - S01 The Git Leak
        #
        # External:
        #   https://10.13.10.20/git/...
        #
        # Internal Gitea receives:
        #   /...
        # --------------------------------------------------

        location = /git {
            return 301 /git/;
        }

        location /git/ {

            # Remove /git/ before forwarding to Gitea
            rewrite ^/git/(.*)$ /$1 break;

            proxy_pass http://gitea_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            client_max_body_size 64m;

            proxy_redirect off;
        }

        # --------------------------------------------------
        # Jenkins
        #
        # Participant URL:
        # https://10.13.10.20/jenkins/
        # --------------------------------------------------

        location /jenkins/ {

            # IMPORTANT:
            # Jenkins itself runs with --prefix=/jenkins
            # therefore do not strip the /jenkins path.

            proxy_pass http://jenkins_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
        }

        # --------------------------------------------------
        # CTFd
        # --------------------------------------------------

        location / {

            proxy_pass http://ctfd_backend;

            proxy_http_version 1.1;


            # Original client information

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;


            # WebSocket support

            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection
                $connection_upgrade;


            # Don't rewrite CTFd redirects unnecessarily

            proxy_redirect off;

            


        }

    }

}