# ==========================================================
# Operation Poisoned Pipeline
# Nginx Reverse Proxy
#
# Phase 5:
#     Browser -> HTTPS Nginx -> CTFd
#
# Later:
#     Gitea and Jenkins routes will also be added here.
# ==========================================================


worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;


events {

    worker_connections 1024;

}


http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # ------------------------------------------------------
    # Logging
    # ------------------------------------------------------

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;


    # ------------------------------------------------------
    # General settings
    # ------------------------------------------------------

    sendfile on;

    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 64m;


    # ------------------------------------------------------
    # WebSocket connection handling
    # ------------------------------------------------------

    map $http_upgrade $connection_upgrade {

        default upgrade;

        '' close;

    }


    # ------------------------------------------------------
    # CTFd backend
    #
    # Docker DNS resolves "ctfd" on control_net.
    # ------------------------------------------------------

    upstream ctfd_backend {

        server ctfd:8000;

        keepalive 16;

    }

    # ------------------------------------------------------
    # Jenkins backend
    # S02 - Pipeline Breach
    # ------------------------------------------------------

    upstream jenkins_backend {
        server jenkins:8080;
        keepalive 8;
    }

    # ------------------------------------------------------
    # Gitea backend
    # S01 - The Git Leak
    # ------------------------------------------------------

    upstream gitea_backend {

        server gitea:3000;

        keepalive 8;

    }

    # ------------------------------------------------------
    # Participant-facing HTTPS server
    # ------------------------------------------------------
